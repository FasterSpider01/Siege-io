<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siege Attack - Massive Multiplayer Arena Game</title>
    <meta name="description" content="Play Siege Attack live! Join a massive 2500x2500 world, build 20 unique structures, level up to 20, and battle players worldwide.">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0a0a0c; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; pointer-events: none; background: rgba(0, 0, 0, 0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        #ui h2 { margin: 0; font-size: 16px; letter-spacing: 1px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        #buildMenu { position: absolute; bottom: 15px; left: 15px; background: rgba(15, 15, 20, 0.85); padding: 12px; border-radius: 10px; max-height: 180px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); }
        .build-btn { background: linear-gradient(135deg, #222, #333); color: white; border: 1px solid #444; padding: 8px; cursor: pointer; font-size: 11px; border-radius: 6px; font-weight: 600; transition: all 0.2s ease; }
        .build-btn:hover { background: linear-gradient(135deg, #00ffcc, #00aa88); color: #000; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        #topBar { position: absolute; top: 15px; right: 15px; }
        button.action { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; backdrop-filter: blur(5px); transition: all 0.2s; }
        button.action:hover { background: rgba(255, 255, 255, 0.25); border-color: #fff; }
        #controls, #joystick { display: none; }
    </style>
</head>
<body>
    <div id="topBar">
        <button class="action" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
    <div id="ui">
        <h2 id="hudStats">Level: 1 | HP: 100/100 | XP: 0</h2>
    </div>
    <div id="buildMenu"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const structuresList = [
            "Wood Wall", "Stone Wall", "Iron Wall", "Gate", "Vault", "Barbed Wire",
            "Spike Trap", "Flame Trap", "Ice Trap", "Mine", "Tesla Coil",
            "Healing Totem", "Speed Pad", "Shield Gen", "Radar Tower", "Bounce Pad", 
            "Ammo Station", "Teleporter", "Mortar", "Mini Turret"
        ];

        const buildMenu = document.getElementById("buildMenu");
        let selectedStructure = structuresList[0];

        structuresList.forEach(struct => {
            const btn = document.createElement("button");
            btn.className = "build-btn";
            btn.innerText = struct;
            btn.onclick = () => { selectedStructure = struct; };
            buildMenu.appendChild(btn);
        });

        let playerId = null;
        let gameState = { players: {}, orbs: [], structures: [] };
        let myPos = { x: 1250, y: 1250 };
        let targetPos = { x: 1250, y: 1250 };
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', e => {
            if (!playerId) return;
            const worldX = myPos.x + (e.clientX - canvas.width / 2);
            const worldY = myPos.y + (e.clientY - canvas.height / 2);
            fetch('/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ structure: { type: selectedStructure, x: worldX, y: worldY, owner: playerId } })
            });
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        fetch('/join', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                playerId = data.playerId;
            });

        // Fast background polling loop for game data sync
        setInterval(() => {
            if (!playerId) return;
            fetch('/state')
                .then(res => res.json())
                .then(data => {
                    gameState = data;
                    if (gameState.players[playerId]) {
                        let p = gameState.players[playerId];
                        document.getElementById('hudStats').innerText = `Level: ${p.level} | HP: ${p.hp}/${p.maxHp} | XP: ${p.xp}`;
                    }
                });
        }, 1000 / 30);

        // Render & Movement Loop running smoothly at maximum refresh rate (60fps+)
        function render() {
            let speed = 6;
            if (keys['w'] || keys['arrowup']) targetPos.y -= speed;
            if (keys['s'] || keys['arrowdown']) targetPos.y += speed;
            if (keys['a'] || keys['arrowleft']) targetPos.x -= speed;
            if (keys['d'] || keys['arrowright']) targetPos.x += speed;

            targetPos.x = Math.max(0, Math.min(2500, targetPos.x));
            targetPos.y = Math.max(0, Math.min(2500, targetPos.y));

            // Smooth linear interpolation (lerp) for silky fluid movement without lag jitter
            myPos.x += (targetPos.x - myPos.x) * 0.25;
            myPos.y += (targetPos.y - myPos.y) * 0.25;

            // Send periodic updates to backend
            if (Math.random() < 0.3 && playerId) {
                fetch('/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: playerId, x: myPos.x, y: myPos.y })
                }).catch(() => {});
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - myPos.x, canvas.height / 2 - myPos.y);

            // Draw Dynamic Arena Floor Grid
            ctx.fillStyle = "#121216";
            ctx.fillRect(0, 0, 2500, 2500);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
            ctx.lineWidth = 1;
            const gridSize = 100;
            for (let x = 0; x <= 2500; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 2500);
                ctx.stroke();
            }
            for (let y = 0; y <= 2500; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(2500, y);
                ctx.stroke();
            }

            // Draw World Boundary Border
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 6;
            ctx.shadowColor = "rgba(0, 255, 204, 0.6)";
            ctx.shadowBlur = 15;
            ctx.strokeRect(0, 0, 2500, 2500);
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Glowing Orbs
            gameState.orbs.forEach(orb => {
                ctx.save();
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 8;
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Structures with visual depth
            gameState.structures.forEach(s => {
                ctx.save();
                ctx.fillStyle = "#4a4e69";
                ctx.strokeStyle = "#22223b";
                ctx.lineWidth = 2;
                ctx.fillRect(s.x - 16, s.y - 16, 32, 32);
                ctx.strokeRect(s.x - 16, s.y - 16, 32, 32);
                ctx.fillStyle = "#fff";
                ctx.font = "9px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(s.type.split(" ")[0], s.x, s.y + 4);
                ctx.restore();
            });

            // Draw Players with Glow Effects and Health Bars
            for (let id in gameState.players) {
                let p = gameState.players[id];
                let isMe = id === playerId;

                ctx.save();
                ctx.shadowColor = isMe ? "#ff3366" : "#3366ff";
                ctx.shadowBlur = 12;
                ctx.fillStyle = isMe ? "#ff3366" : "#3366ff";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Outer ring
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // Player name / level tag
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`Lvl ${p.level}`, p.x, p.y - 30);

                // Mini Health Bar
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(p.x - 20, p.y - 46, 40, 6);
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(p.x - 20, p.y - 46, 40 * (p.hp / p.maxHp), 6);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
