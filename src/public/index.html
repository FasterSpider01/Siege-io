<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siege Attack - Online Multiplayer Arena Game</title>
  <meta name="description" content="Play Siege Attack online! Build structures, level up to 20, and battle players live.">
  <link rel="canonical" href="https://siegeattack.wasmer.app/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; }
    
    #gameCanvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 1; display: block;
    }
    
    #startScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 14, 23, 0.95); display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 100;
    }
    .card { background: #1a2233; padding: 20px; border-radius: 12px; border: 1px solid #2e3c56; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 0 20px rgba(0,210,255,0.2); }
    h1 { font-size: 2rem; color: #00d2ff; margin-bottom: 12px; font-weight: 900; letter-spacing: 2px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3b4d6e; background: #0f1522; color: #fff; margin-bottom: 15px; outline: none; font-size: 1rem; text-align: center; }
    
    .build-picker { margin-bottom: 15px; text-align: left; }
    .build-picker label { font-size: 0.75rem; color: #88a0c0; text-transform: uppercase; display: block; margin-bottom: 5px; }
    select { width: 100%; padding: 10px; background: #0f1522; color: #fff; border: 1px solid #3b4d6e; border-radius: 6px; font-size: 0.9rem; outline: none; }

    .btn { width: 100%; padding: 14px; background: #00d2ff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 8px; }
    .btn-fs { background: #2ed573; color: #000; margin-bottom: 10px; }

    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(15, 21, 34, 0.85); padding: 12px; border-radius: 8px; width: 160px; border: 1px solid #2e3c56; }
    #leaderboard h3 { font-size: 0.75rem; text-transform: uppercase; color: #88a0c0; margin-bottom: 6px; }
    .leader-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 3px; }
    
    #bottomStats { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 12; }
    .bar-container { width: 240px; height: 14px; background: rgba(0,0,0,0.6); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); position: relative; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }
    #hpFill { background: #2ed573; }
    #xpFill { background: #eccc68; }
    .bar-text { position: absolute; width: 100%; text-align: center; font-size: 0.65rem; font-weight: bold; line-height: 14px; text-shadow: 1px 1px 2px #000; }
    
    #minimap { position: absolute; top: 15px; left: 15px; width: 100px; height: 100px; background: rgba(15, 21, 34, 0.85); border: 2px solid #2e3c56; border-radius: 8px; }

    /* Mobile Controls */
    #moveZone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto; touch-action: none; display: none; }
    #moveKnob { position: absolute; top: 32px; left: 32px; width: 45px; height: 45px; border-radius: 50%; background: rgba(0, 210, 255, 0.6); pointer-events: none; }
    
    #mobileShootBtn { position: absolute; bottom: 35px; right: 25px; width: 80px; height: 80px; border-radius: 50%; background: #ff4757; border: 3px solid #ff6b81; color: #fff; font-weight: 900; font-size: 1.1rem; pointer-events: auto; display: none; box-shadow: 0 0 15px rgba(255,71,87,0.5); }
    #mobileBuildBtn { position: absolute; bottom: 130px; right: 35px; width: 60px; height: 60px; border-radius: 50%; background: #f59e0b; border: 2px solid #fbbf24; color: #000; font-weight: bold; font-size: 0.7rem; pointer-events: auto; display: none; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <div id="leaderList"></div>
    </div>
    <div id="bottomStats">
      <div class="bar-container">
        <div id="hpFill" class="bar-fill"></div>
        <div id="hpText" class="bar-text">HP: 120 / 120</div>
      </div>
      <div class="bar-container">
        <div id="xpFill" class="bar-fill"></div>
        <div id="xpText" class="bar-text">LEVEL 1 / 20</div>
      </div>
    </div>
    <canvas id="minimap"></canvas>

    <div id="moveZone"><div id="moveKnob"></div></div>
    <button id="mobileShootBtn">FIRE</button>
    <button id="mobileBuildBtn">BUILD</button>
  </div>

  <div id="startScreen">
    <div class="card">
      <h1>SIEGE ATTACK</h1>
      <button class="btn btn-fs" id="fsBtn" onclick="toggleFullscreen()">ENTER FULLSCREEN</button>
      <input type="text" id="playerName" placeholder="Enter Hero Name" maxlength="12" value="Commander">
      
      <div class="build-picker">
        <label>Select Structure to Build (Press 'E' or Button)</label>
        <select id="buildTypeSelect">
          <option value="Wood Wall">1. Wood Wall</option>
          <option value="Stone Wall">2. Stone Wall</option>
          <option value="Iron Wall">3. Iron Wall</option>
          <option value="Spike Trap">4. Spike Trap</option>
          <option value="Gate">5. Gate</option>
          <option value="Healing Totem">6. Healing Totem</option>
          <option value="Speed Pad">7. Speed Pad</option>
          <option value="Mini Turret">8. Mini Turret</option>
          <option value="Shield Gen">9. Shield Gen</option>
          <option value="Mine">10. Mine</option>
          <option value="Radar Tower">11. Radar Tower</option>
          <option value="Barbed Wire">12. Barbed Wire</option>
          <option value="Bounce Pad">13. Bounce Pad</option>
          <option value="Ammo Station">14. Ammo Station</option>
          <option value="Flame Trap">15. Flame Trap</option>
          <option value="Ice Trap">16. Ice Trap</option>
          <option value="Teleporter">17. Teleporter</option>
          <option value="Mortar">18. Mortar</option>
          <option value="Tesla Coil">19. Tesla Coil</option>
          <option value="Vault">20. Vault</option>
        </select>
      </div>

      <button class="btn" onclick="joinGame()">DEPLOY HERO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const mctx = minimapCanvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 100;
      minimapCanvas.height = 100;
    }
    window.addEventListener('resize', resize);
    resize();

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouchDevice) {
      document.getElementById('moveZone').style.display = 'block';
      document.getElementById('mobileShootBtn').style.display = 'block';
      document.getElementById('mobileBuildBtn').style.display = 'block';
    }

    let myId = null;
    let players = {};
    let bullets = [];
    let orbs = [];
    let structures = [];
    let mapWidth = 2500;
    let mapHeight = 2500;

    let localPos = { x: 1250, y: 1250 };
    let localAngle = 0;
    let wantShoot = false;
    let wantBuild = false;
    let lastTime = performance.now();

    const keys = {};
    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') wantBuild = true;
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', e => {
      if (e.button === 0 && myId && players[myId] && players[myId].hp > 0 && !isTouchDevice) {
        wantShoot = true;
      }
    });

    const shootBtn = document.getElementById('mobileShootBtn');
    shootBtn.addEventListener('touchstart', e => { e.preventDefault(); wantShoot = true; });
    
    const buildBtn = document.getElementById('mobileBuildBtn');
    buildBtn.addEventListener('touchstart', e => { e.preventDefault(); wantBuild = true; });

    const moveInput = { x: 0, y: 0 };
    const moveZone = document.getElementById('moveZone');
    const moveKnob = document.getElementById('moveKnob');
    let moveTouchId = null;
    let joystickCenter = { x: 0, y: 0 };

    moveZone.addEventListener('touchstart', e => {
      if (moveTouchId !== null) return;
      const t = e.changedTouches[0];
      moveTouchId = t.identifier;
      const r = moveZone.getBoundingClientRect();
      joystickCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      updateJoystick(t.clientX, t.clientY);
    });

    window.addEventListener('touchmove', e => {
      if (moveTouchId === null) return;
      for (let t of e.changedTouches) {
        if (t.identifier === moveTouchId) {
          updateJoystick(t.clientX, t.clientY);
          break;
        }
      }
    });

    const resetJoystick = e => {
      if (moveTouchId === null) return;
      for (let t of e.changedTouches) {
        if (t.identifier === moveTouchId) {
          moveTouchId = null;
          moveKnob.style.transform = `translate(0px, 0px)`;
          moveInput.x = 0;
          moveInput.y = 0;
          break;
        }
      }
    };
    window.addEventListener('touchend', resetJoystick);
    window.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(tx, ty) {
      let dx = tx - joystickCenter.x;
      let dy = ty - joystickCenter.y;
      let dist = Math.hypot(dx, dy);
      let maxDist = 32;
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }
      moveKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveInput.x = dx / maxDist;
      moveInput.y = dy / maxDist;
    }

    async function joinGame() {
      const name = document.getElementById('playerName').value || 'Hero';
      try {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        });
        const data = await res.json();
        myId = data.id;
        mapWidth = data.mapWidth;
        mapHeight = data.mapHeight;
        players = data.players || {};
        orbs = data.orbs || [];
        structures = data.structures || [];
        
        if (players[myId]) {
          localPos.x = players[myId].x;
          localPos.y = players[myId].y;
        }

        document.getElementById('startScreen').style.display = 'none';
        startNetworkSync();
      } catch(e) {
        console.error("Failed to join game:", e);
      }
    }

    function returnToHomeScreen() {
      document.getElementById('startScreen').style.display = 'flex';
      players = {};
      myId = null;
    }

    function startNetworkSync() {
      setInterval(async () => {
        if (!myId) return;

        const selectedBuildType = document.getElementById('buildTypeSelect').value;
        const payload = {
          id: myId,
          x: localPos.x,
          y: localPos.y,
          angle: localAngle,
          shoot: wantShoot,
          shootAngle: localAngle,
          buildItem: wantBuild,
          buildType: selectedBuildType
        };
        wantShoot = false;
        wantBuild = false;

        try {
          const res = await fetch('/api/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const state = await res.json();
          bullets = state.bullets || [];
          orbs = state.orbs || [];
          structures = state.structures || [];
          players = state.players || {};

          if (!players[myId]) {
            returnToHomeScreen();
          } else {
            updateHUD();
          }
        } catch(err) {
          console.error("Sync error:", err);
        }
      }, 50);
    }

    function updateLocalPhysics(dt) {
      if (!myId || !players[myId]) return;
      const p = players[myId];

      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (moveInput.x !== 0 || moveInput.y !== 0) {
        dx = moveInput.x;
        dy = moveInput.y;
      }

      const len = Math.hypot(dx, dy);
      if (len > 0) {
        const speed = p.speed * 60; 
        localPos.x += (dx / (len > 1 ? len : 1)) * speed * dt;
        localPos.y += (dy / (len > 1 ? len : 1)) * speed * dt;

        localPos.x = Math.max(30, Math.min(mapWidth - 30, localPos.x));
        localPos.y = Math.max(30, Math.min(mapHeight - 30, localPos.y));

        if (isTouchDevice) {
          localAngle = Math.atan2(dy, dx);
        }
      }

      if (!isTouchDevice) {
        const worldX = mouse.x - canvas.width / 2 + localPos.x;
        const worldY = mouse.y - canvas.height / 2 + localPos.y;
        localAngle = Math.atan2(worldY - localPos.y, worldX - localPos.x);
      }

      p.x = localPos.x;
      p.y = localPos.y;
      p.angle = localAngle;
    }

    function render(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      updateLocalPhysics(dt);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      
      ctx.translate(canvas.width / 2 - localPos.x, canvas.height / 2 - localPos.y);
      
      ctx.strokeStyle = '#26334d';
      ctx.lineWidth = 2;
      for (let x = 0; x <= mapWidth; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapHeight); ctx.stroke();
      }
      for (let y = 0; y <= mapHeight; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapWidth, y); ctx.stroke();
      }

      structures.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.fillStyle = '#475569';
        ctx.beginPath(); ctx.arc(0, 0, s.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.type, 0, -s.radius - 16);

        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-30, -s.radius - 10, 60, 5);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(-30, -s.radius - 10, Math.max(0, (s.hp / s.maxHp) * 60), 5);
        ctx.restore();
      });

      orbs.forEach(o => {
        ctx.beginPath();
        ctx.arc(o.x, o.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = o.type === 'health' ? '#10b981' : (o.type === 'speed' ? '#f59e0b' : (o.type === 'damage' ? '#ef4444' : '#3b82f6'));
        ctx.fill();
      });

      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();
      });

      Object.values(players).forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        
        if (p.shield) {
          ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2);
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
        }

        ctx.rotate(p.angle);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-20, -20, 40, 40);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, -6, 30, 12);
        ctx.restore();
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.name} [Lv.${p.level}]`, p.x, p.y - 32);
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(p.x - 25, p.y - 26, 50, 6);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x - 25, p.y - 26, Math.max(0, (p.hp / p.maxHp) * 50), 6);
      });

      ctx.restore();
      
      mctx.clearRect(0, 0, 100, 100);
      const scaleX = 100 / mapWidth;
      const scaleY = 100 / mapHeight;
      Object.values(players).forEach(p => {
        mctx.fillStyle = p.id === myId ? '#10b981' : '#ef4444';
        mctx.beginPath();
        mctx.arc(p.x * scaleX, p.y * scaleY, 3, 0, Math.PI * 2);
        mctx.fill();
      });

      requestAnimationFrame(render);
    }

    function updateHUD() {
      if (!myId || !players[myId]) return;
      const p = players[myId];
      document.getElementById('hpFill').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
      document.getElementById('hpText').innerText = `HP: ${Math.ceil(p.hp)} / ${p.maxHp}`;
      
      const xpNeeded = p.level * 200;
      document.getElementById('xpFill').style.width = `${Math.min(100, (p.xp / xpNeeded) * 100)}%`;
      document.getElementById('xpText').innerText = `LEVEL ${p.level} / 20`;

      const sorted = Object.values(players).sort((a,b) => b.score - a.score).slice(0, 5);
      const list = document.getElementById('leaderList');
      list.innerHTML = '';
      sorted.forEach((lp, i) => {
        const row = document.createElement('div');
        row.className = 'leader-row';
        row.innerHTML = `<span>${i+1}. ${lp.name}</span><strong>${lp.score}</strong>`;
        list.appendChild(row);
      });
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
