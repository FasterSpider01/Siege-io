<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Multiplayer Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        canvas {
            border: 2px solid #333;
            background: #ffffff;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Multiplayer Square Game</h1>
    <p>Use your <strong>Arrow Keys</strong> to move your square around!</p>
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Connect to the Python WebSocket server
        const ws = new WebSocket('ws://localhost:8765');

        // Generate a unique ID and random starting position/color for this player
        const myId = Math.random().toString(36).substring(7);
        let myData = {
            id: myId,
            x: Math.floor(Math.random() * 400) + 50,
            y: Math.floor(Math.random() * 400) + 50,
            color: '#' + Math.floor(Math.random() * 16777215).toString(16)
        };

        let players = {};

        ws.onopen = () => {
            // Send initial position when connected
            ws.send(JSON.stringify(myData));
        };

        ws.onmessage = (event) => {
            // Receive position updates from other players
            const data = JSON.parse(event.data);
            players[data.id] = data;
        };

        // Listen for keyboard input to move the square
        window.addEventListener('keydown', (e) => {
            let moved = false;
            const speed = 15;

            if (e.key === 'ArrowUp') { myData.y -= speed; moved = true; }
            if (e.key === 'ArrowDown') { myData.y += speed; moved = true; }
            if (e.key === 'ArrowLeft') { myData.x -= speed; moved = true; }
            if (e.key === 'ArrowRight') { myData.x += speed; moved = true; }

            if (moved) {
                ws.send(JSON.stringify(myData));
            }
        });

        // Game render loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw yourself
            ctx.fillStyle = myData.color;
            ctx.fillRect(myData.x, myData.y, 30, 30);

            // Draw all other players
            for (let id in players) {
                let p = players[id];
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 30, 30);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

</body>
</html>
