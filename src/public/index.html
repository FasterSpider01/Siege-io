<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siege.io - Battle Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; }
    
    #gameCanvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 1; display: block;
    }
    
    #startScreen, #deathScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 14, 23, 0.92); display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 100;
    }
    .card { background: #1a2233; padding: 25px; border-radius: 12px; border: 1px solid #2e3c56; text-align: center; width: 90%; max-width: 360px; }
    h1 { font-size: 2.2rem; color: #00d2ff; margin-bottom: 15px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3b4d6e; background: #0f1522; color: #fff; margin-bottom: 15px; outline: none; font-size: 1rem; }
    .class-select { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .class-btn { flex: 1; padding: 10px 4px; margin: 0 3px; background: #243047; border: 2px solid transparent; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .class-btn.active { border-color: #00d2ff; background: #183d5a; }
    .btn { width: 100%; padding: 14px; background: #00d2ff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }

    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(15, 21, 34, 0.85); padding: 12px; border-radius: 8px; width: 170px; border: 1px solid #2e3c56; }
    #leaderboard h3 { font-size: 0.8rem; text-transform: uppercase; color: #88a0c0; margin-bottom: 6px; }
    .leader-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 3px; }
    
    #bottomStats { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 12; }
    .bar-container { width: 260px; height: 14px; background: rgba(0,0,0,0.6); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); position: relative; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }
    #hpFill { background: #2ed573; }
    #xpFill { background: #eccc68; }
    .bar-text { position: absolute; width: 100%; text-align: center; font-size: 0.65rem; font-weight: bold; line-height: 14px; text-shadow: 1px 1px 2px #000; }
    
    #minimap { position: absolute; top: 15px; left: 15px; width: 110px; height: 110px; background: rgba(15, 21, 34, 0.85); border: 2px solid #2e3c56; border-radius: 8px; }

    /* Mobile Controls */
    .joystick-zone { position: absolute; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto; touch-action: none; display: none; }
    #moveZone { left: 25px; }
    #shootZone { right: 25px; }
    .joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(0, 210, 255, 0.5); pointer-events: none; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <div id="leaderList"></div>
    </div>
    <div id="bottomStats">
      <div class="bar-container">
        <div id="hpFill" class="bar-fill"></div>
        <div id="hpText" class="bar-text">HP: 100 / 100</div>
      </div>
      <div class="bar-container">
        <div id="xpFill" class="bar-fill"></div>
        <div id="xpText" class="bar-text">LEVEL 1</div>
      </div>
    </div>
    <canvas id="minimap"></canvas>

    <div id="moveZone" class="joystick-zone">
      <div id="moveKnob" class="joystick-knob"></div>
    </div>
    <div id="shootZone" class="joystick-zone">
      <div id="shootKnob" class="joystick-knob" style="background: rgba(255, 71, 87, 0.5);"></div>
    </div>
  </div>

  <div id="startScreen">
    <div class="card">
      <h1>SIEGE.IO</h1>
      <input type="text" id="playerName" placeholder="Enter Hero Name" maxlength="12" value="Commander">
      <div class="class-select">
        <button class="class-btn active" onclick="selectClass('Attacker', this)">Attacker</button>
        <button class="class-btn" onclick="selectClass('Defender', this)">Defender</button>
        <button class="class-btn" onclick="selectClass('Scout', this)">Scout</button>
      </div>
      <button class="btn" onclick="joinGame()">DEPLOY HERO</button>
    </div>
  </div>

  <div id="deathScreen" style="display: none;">
    <div class="card">
      <h1 style="color: #ff4757;">DESTROYED</h1>
      <p style="margin-bottom: 20px; color: #a4b0be;">Your hero fell in battle.</p>
      <button class="btn" onclick="respawn()">RESPAWN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const mctx = minimapCanvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 110;
      minimapCanvas.height = 110;
    }
    window.addEventListener('resize', resize);
    resize();

    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouchDevice) {
      document.getElementById('moveZone').style.display = 'block';
      document.getElementById('shootZone').style.display = 'block';
    }

    let myId = null;
    let selectedClass = 'Attacker';
    let players = {};
    let bullets = [];
    let orbs = [];
    let mapWidth = 2500;
    let mapHeight = 2500;

    let localPos = { x: 1250, y: 1250 };
    let wantShoot = false;
    let shootAngle = 0;
    let lastTime = performance.now();

    const keys = {};
    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', e => {
      if (e.button === 0 && myId && players[myId] && players[myId].hp > 0 && !isTouchDevice) {
        wantShoot = true;
        const p = players[myId];
        const worldX = mouse.x - canvas.width / 2 + localPos.x;
        const worldY = mouse.y - canvas.height / 2 + localPos.y;
        shootAngle = Math.atan2(worldY - localPos.y, worldX - localPos.x);
      }
    });

    // Touch Controls
    const moveInput = { x: 0, y: 0 };
    function setupJoystick(zoneId, knobId, onMove, onEnd) {
      const zone = document.getElementById(zoneId);
      const knob = document.getElementById(knobId);
      let touchId = null;
      let center = { x: 0, y: 0 };

      zone.addEventListener('touchstart', e => {
        if (touchId !== null) return;
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        const rect = zone.getBoundingClientRect();
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateKnob(touch.clientX, touch.clientY);
      });

      window.addEventListener('touchmove', e => {
        if (touchId === null) return;
        for (let t of e.changedTouches) {
          if (t.identifier === touchId) {
            updateKnob(t.clientX, t.clientY);
            break;
          }
        }
      });

      const reset = e => {
        if (touchId === null) return;
        for (let t of e.changedTouches) {
          if (t.identifier === touchId) {
            touchId = null;
            knob.style.transform = `translate(0px, 0px)`;
            if (onEnd) onEnd();
            break;
          }
        }
      };

      window.addEventListener('touchend', reset);
      window.addEventListener('touchcancel', reset);

      function updateKnob(tx, ty) {
        let dx = tx - center.x;
        let dy = ty - center.y;
        let dist = Math.hypot(dx, dy);
        let maxDist = 35;
        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        onMove(dx / maxDist, dy / maxDist);
      }
    }

    setupJoystick('moveZone', 'moveKnob', (nx, ny) => {
      moveInput.x = nx;
      moveInput.y = ny;
    }, () => {
      moveInput.x = 0;
      moveInput.y = 0;
    });

    let autoShootInterval = null;
    setupJoystick('shootZone', 'shootKnob', (nx, ny) => {
      if (Math.hypot(nx, ny) > 0.3) {
        shootAngle = Math.atan2(ny, nx);
        wantShoot = true;
        if (!autoShootInterval) {
          autoShootInterval = setInterval(() => { wantShoot = true; }, 180);
        }
      }
    }, () => {
      if (autoShootInterval) {
        clearInterval(autoShootInterval);
        autoShootInterval = null;
      }
    });

    function selectClass(className, btn) {
      selectedClass = className;
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function joinGame() {
      const name = document.getElementById('playerName').value || 'Hero';
      try {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, class: selectedClass })
        });
        const data = await res.json();
        myId = data.id;
        mapWidth = data.mapWidth;
        mapHeight = data.mapHeight;
        players = data.players || {};
        orbs = data.orbs || [];
        
        if (players[myId]) {
          localPos.x = players[myId].x;
          localPos.y = players[myId].y;
        }

        document.getElementById('startScreen').style.display = 'none';
        startNetworkSync();
      } catch(e) {
        console.error("Failed to join game:", e);
      }
    }

    function respawn() {
      document.getElementById('deathScreen').style.display = 'none';
      joinGame();
    }

    function startNetworkSync() {
      setInterval(async () => {
        if (!myId) return;

        let angle = shootAngle;
        if (!isTouchDevice && players[myId]) {
          const worldX = mouse.x - canvas.width / 2 + localPos.x;
          const worldY = mouse.y - canvas.height / 2 + localPos.y;
          angle = Math.atan2(worldY - localPos.y, worldX - localPos.x);
        }

        const payload = {
          id: myId,
          x: localPos.x,
          y: localPos.y,
          angle: angle,
          shoot: wantShoot,
          shootAngle: shootAngle
        };
        wantShoot = false;

        try {
          const res = await fetch('/api/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const state = await res.json();
          bullets = state.bullets || [];
          orbs = state.orbs || [];
          
          // Reconcile non-local players
          Object.keys(state.players || {}).forEach(id => {
            if (id !== myId) {
              players[id] = state.players[id];
            } else {
              // Update local player stats without overriding smooth position directly
              if (players[myId]) {
                players[myId].hp = state.players[myId].hp;
                players[myId].maxHp = state.players[myId].maxHp;
                players[myId].level = state.players[myId].level;
                players[myId].xp = state.players[myId].xp;
                players[myId].score = state.players[myId].score;
                players[myId].shield = state.players[myId].shield;
                players[myId].speed = state.players[myId].speed;
              } else {
                players[myId] = state.players[myId];
              }
            }
          });

          if (players[myId] && players[myId].hp <= 0) {
            document.getElementById('deathScreen').style.display = 'flex';
          }
          updateHUD();
        } catch(err) {
          console.error("Sync error:", err);
        }
      }, 50);
    }

    function updateLocalPhysics(dt) {
      if (!myId || !players[myId] || players[myId].hp <= 0) return;
      const p = players[myId];

      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (moveInput.x !== 0 || moveInput.y !== 0) {
        dx = moveInput.x;
        dy = moveInput.y;
      }

      const len = Math.hypot(dx, dy);
      if (len > 0) {
        const speed = p.speed * 60; 
        localPos.x += (dx / (len > 1 ? len : 1)) * speed * dt;
        localPos.y += (dy / (len > 1 ? len : 1)) * speed * dt;

        localPos.x = Math.max(30, Math.min(mapWidth - 30, localPos.x));
        localPos.y = Math.max(30, Math.min(mapHeight - 30, localPos.y));
      }
      
      p.x = localPos.x;
      p.y = localPos.y;

      if (!isTouchDevice) {
        const worldX = mouse.x - canvas.width / 2 + localPos.x;
        const worldY = mouse.y - canvas.height / 2 + localPos.y;
        p.angle = Math.atan2(worldY - localPos.y, worldX - localPos.x);
      } else if (Math.hypot(moveInput.x, moveInput.y) > 0.1) {
        p.angle = Math.atan2(moveInput.y, moveInput.x);
      }
    }

    function render(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      updateLocalPhysics(dt);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2 - localPos.x, canvas.height / 2 - localPos.y);
      
      // Arena Grid
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      for (let x = 0; x <= mapWidth; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapHeight); ctx.stroke();
      }
      for (let y = 0; y <= mapHeight; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapWidth, y); ctx.stroke();
      }

      // Collectible Orbs
      orbs.forEach(o => {
        ctx.beginPath();
        ctx.arc(o.x, o.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = o.type === 'health' ? '#10b981' : (o.type === 'speed' ? '#f59e0b' : (o.type === 'damage' ? '#ef4444' : '#3b82f6'));
        ctx.fill();
      });

      // Bullets
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();
      });

      // Render Players
      Object.values(players).forEach(p => {
        if (p.hp <= 0) return;
        ctx.save();
        ctx.translate(p.x, p.y);
        
        if (p.shield) {
          ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI * 2);
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
        }

        ctx.rotate(p.angle);
        ctx.fillStyle = p.class === 'Defender' ? '#f59e0b' : (p.class === 'Scout' ? '#10b981' : '#0284c7');
        ctx.fillRect(-20, -20, 40, 40);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, -5, 28, 10);
        ctx.restore();
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.name} [Lv.${p.level}]`, p.x, p.y - 32);
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(p.x - 25, p.y - 26, 50, 6);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x - 25, p.y - 26, (p.hp / p.maxHp) * 50, 6);
      });

      ctx.restore();
      
      // Minimap
      mctx.clearRect(0, 0, 110, 110);
      const scaleX = 110 / mapWidth;
      const scaleY = 110 / mapHeight;
      Object.values(players).forEach(p => {
        if (p.hp <= 0) return;
        mctx.fillStyle = p.id === myId ? '#10b981' : '#ef4444';
        mctx.beginPath();
        mctx.arc(p.x * scaleX, p.y * scaleY, 3, 0, Math.PI * 2);
        mctx.fill();
      });

      requestAnimationFrame(render);
    }

    function updateHUD() {
      if (!myId || !players[myId]) return;
      const p = players[myId];
      document.getElementById('hpFill').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
      document.getElementById('hpText').innerText = `HP: ${Math.ceil(p.hp)} / ${p.maxHp}`;
      
      const xpNeeded = p.level * 150;
      document.getElementById('xpFill').style.width = `${Math.min(100, (p.xp / xpNeeded) * 100)}%`;
      document.getElementById('xpText').innerText = `LEVEL ${p.level} (${p.class.toUpperCase()})`;

      const sorted = Object.values(players).sort((a,b) => b.score - a.score).slice(0, 5);
      const list = document.getElementById('leaderList');
      list.innerHTML = '';
      sorted.forEach((lp, i) => {
        const row = document.createElement('div');
        row.className = 'leader-row';
        row.innerHTML = `<span>${i+1}. ${lp.name}</span><strong>${lp.score}</strong>`;
        list.appendChild(row);
      });
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
