<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siege.io - Battle Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; background: #121721; }
    
    #startScreen, #deathScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 14, 23, 0.92); display: flex;
      flex-direction: column; justify-content: center; align-items: center; z-index: 100;
    }
    .card { background: #1a2233; padding: 30px; border-radius: 12px; border: 1px solid #2e3c56; text-align: center; width: 360px; }
    h1 { font-size: 2.2rem; color: #00d2ff; margin-bottom: 15px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3b4d6e; background: #0f1522; color: #fff; margin-bottom: 15px; outline: none; }
    .class-select { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .class-btn { flex: 1; padding: 10px; margin: 0 4px; background: #243047; border: 2px solid transparent; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
    .class-btn.active { border-color: #00d2ff; background: #183d5a; }
    .btn { width: 100%; padding: 12px; background: #00d2ff; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(15, 21, 34, 0.75); padding: 15px; border-radius: 8px; width: 200px; }
    #leaderboard h3 { font-size: 0.9rem; text-transform: uppercase; color: #88a0c0; margin-bottom: 8px; }
    .leader-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    
    #bottomStats { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .bar-container { width: 300px; height: 16px; background: rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); position: relative; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
    #hpFill { background: #2ed573; }
    #xpFill { background: #eccc68; }
    .bar-text { position: absolute; width: 100%; text-align: center; font-size: 0.7rem; font-weight: bold; line-height: 16px; }
    
    #minimap { position: absolute; bottom: 20px; right: 20px; width: 140px; height: 140px; background: rgba(15, 21, 34, 0.85); border: 2px solid #2e3c56; border-radius: 8px; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <div id="leaderList"></div>
    </div>
    <div id="bottomStats">
      <div class="bar-container">
        <div id="hpFill" class="bar-fill"></div>
        <div id="hpText" class="bar-text">HP: 100 / 100</div>
      </div>
      <div class="bar-container">
        <div id="xpFill" class="bar-fill"></div>
        <div id="xpText" class="bar-text">LEVEL 1</div>
      </div>
    </div>
    <canvas id="minimap"></canvas>
  </div>

  <div id="startScreen">
    <div class="card">
      <h1>SIEGE.IO</h1>
      <input type="text" id="playerName" placeholder="Enter Hero Name" maxlength="12" value="Commander">
      <div class="class-select">
        <button class="class-btn active" onclick="selectClass('Attacker', this)">Attacker</button>
        <button class="class-btn" onclick="selectClass('Defender', this)">Defender</button>
        <button class="class-btn" onclick="selectClass('Scout', this)">Scout</button>
      </div>
      <button class="btn" onclick="joinGame()">DEPLOY HERO</button>
    </div>
  </div>

  <div id="deathScreen" style="display: none;">
    <div class="card">
      <h1 style="color: #ff4757;">DESTROYED</h1>
      <p style="margin-bottom: 20px; color: #a4b0be;">Your hero fell in battle.</p>
      <button class="btn" onclick="respawn()">RESPAWN</button>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
