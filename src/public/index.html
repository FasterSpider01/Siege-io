content="website">

<body>



<div id="hud">

<div id="logo">
⚔ Siege Attack
</div>


<div id="stats">
Connecting...
</div>


</div>



<div id="crosshair"></div>



<canvas id="gameCanvas"></canvas>




<script>


// ======================================================
// ENGINE SETTINGS
// ======================================================


const WORLD_SIZE = 2500;

const TILE_SIZE = 50;


const canvas =
document.getElementById(
"gameCanvas"
);


const ctx =
canvas.getContext(
"2d"
);



function resizeCanvas(){

    canvas.width =
    window.innerWidth;


    canvas.height =
    window.innerHeight;

}


window.addEventListener(
"resize",
resizeCanvas
);


resizeCanvas();





// ======================================================
// GAME DATA
// ======================================================


let playerId = null;



let gameState = {


    players:{},


    structures:[],


    projectiles:[],


    orbs:[],


    scrap:[]

};



let localPlayer = {


    x:1250,


    y:1250,


    vx:0,


    vy:0

};





// ======================================================
// CAMERA SYSTEM
// ======================================================


const camera = {


    x:1250,


    y:1250,


    smooth:0.12


};



function updateCamera(){


    camera.x +=
    (
        localPlayer.x -
        camera.x
    )
    *
    camera.smooth;



    camera.y +=
    (
        localPlayer.y -
        camera.y
    )
    *
    camera.smooth;


}





// ======================================================
// INPUT SYSTEM
// ======================================================


const keys={};



window.addEventListener(
"keydown",
event=>{


    keys[
        event.key.toLowerCase()
    ]=true;


});



window.addEventListener(
"keyup",
event=>{


    keys[
        event.key.toLowerCase()
    ]=false;


});





const mouse={

    x:0,

    y:0

};




window.addEventListener(
"mousemove",
event=>{


    mouse.x =
    event.clientX;


    mouse.y =
    event.clientY;



    const cross =
    document.getElementById(
        "crosshair"
    );


    cross.style.display="block";


    cross.style.left =
    mouse.x+"px";


    cross.style.top =
    mouse.y+"px";


});







// ======================================================
// NETWORKING
// ======================================================


async function joinGame(){


    try{


        const response =
        await fetch(
            "/join",
            {
                method:"POST"
            }
        );



        const data =
        await response.json();



        playerId =
        data.id;



        localPlayer.x =
        data.player.x;


        localPlayer.y =
        data.player.y;



    }

    catch(error){

        console.log(
            "Server unavailable"
        );

    }


}





async function updateState(){


    try{


        const response =
        await fetch(
            "/state"
        );



        gameState =
        await response.json();



        if(
            playerId &&
            gameState.players[playerId]
        ){


            const p =
            gameState.players[playerId];



            document.getElementById(
                "stats"
            ).innerHTML = `

            Level:
            ${p.level}<br>

            HP:
            ${p.hp}/${p.max_hp}<br>

            Scrap:
            ${p.scrap}<br>

            XP:
            ${p.xp}

            `;


        }



    }

    catch(error){}



}



setInterval(
updateState,
1000/30
);







// ======================================================
// PLAYER MOVEMENT
// ======================================================


function movementTick(){


    if(!playerId)
    return;



    let vx=0;

    let vy=0;



    if(
        keys["w"] ||
        keys["arrowup"]
    )
    vy=-1;



    if(
        keys["s"] ||
        keys["arrowdown"]
    )
    vy=1;



    if(
        keys["a"] ||
        keys["arrowleft"]
    )
    vx=-1;



    if(
        keys["d"] ||
        keys["arrowright"]
    )
    vx=1;



    localPlayer.x += vx*5;

    localPlayer.y += vy*5;



    localPlayer.x =
    Math.max(
        0,
        Math.min(
            WORLD_SIZE,
            localPlayer.x
        )
    );



    localPlayer.y =
    Math.max(
        0,
        Math.min(
            WORLD_SIZE,
            localPlayer.y
        )
    );



    fetch(
        "/update",
        {

        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },


        body:
        JSON.stringify({

            id:playerId,

            vx:vx,

            vy:vy

        })


        }
    );


}



setInterval(
movementTick,
1000/20
);






// ======================================================
// CAMERA TRANSFORM
// ======================================================


function worldStart(){


    ctx.save();


    ctx.translate(

        canvas.width/2 -
        camera.x,


        canvas.height/2 -
        camera.y

    );


}



function worldEnd(){


    ctx.restore();


}






// ======================================================
// WORLD BACKGROUND
// ======================================================


function drawWorld(){



    ctx.fillStyle =
    "#080811";


    ctx.fillRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );



    ctx.strokeStyle =
    "rgba(0,255,204,.06)";



    for(
        let x=0;
        x<=WORLD_SIZE;
        x+=TILE_SIZE
    ){


        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );


        ctx.lineTo(
            x,
            WORLD_SIZE
        );


        ctx.stroke();


    }



    for(
        let y=0;
        y<=WORLD_SIZE;
        y+=TILE_SIZE
    ){


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );


        ctx.lineTo(
            WORLD_SIZE,
            y
        );


        ctx.stroke();


    }




    ctx.strokeStyle="#00ffcc";

    ctx.lineWidth=5;


    ctx.strokeRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );


}





// ======================================================
// MAIN LOOP
// ======================================================


function gameLoop(){


    updateCamera();



    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    worldStart();



    drawWorld();



    // PART 2 WILL ADD:
    // drawOrbs()
    // drawStructures()
    // drawProjectiles()
    // drawPlayers()



    worldEnd();



    requestAnimationFrame(
        gameLoop
    );


}





joinGame();

gameLoop();


// IMPORTANT:
// DO NOT CLOSE SCRIPT/BODY/HTML HERE.
// PART 2 CONTINUES BELOW.
// ======================================================
// RENDERING HELPERS
// ======================================================


function visibleEntity(x,y,padding=100){

    return (

        x >
        camera.x -
        canvas.width/2 -
        padding

        &&

        x <
        camera.x +
        canvas.width/2 +
        padding


        &&


        y >
        camera.y -
        canvas.height/2 -
        padding


        &&


        y <
        camera.y +
        canvas.height/2 +
        padding

    );

}





function drawHealthBar(
    x,
    y,
    width,
    hp,
    maxHp,
    color="#00ffcc"
){

    const ratio =
    Math.max(
        0,
        Math.min(
            1,
            hp/maxHp
        )
    );


    ctx.fillStyle=
    "rgba(0,0,0,.6)";


    ctx.fillRect(
        x-width/2,
        y,
        width,
        6
    );


    ctx.fillStyle=color;


    ctx.fillRect(
        x-width/2,
        y,
        width*ratio,
        6
    );

}





// ======================================================
// XP ORBS
// ======================================================


function drawOrbs(){


    if(!gameState.orbs)
    return;



    for(
        const orb of gameState.orbs
    ){


        if(
            !visibleEntity(
                orb.x,
                orb.y
            )
        )
        continue;



        ctx.save();


        ctx.shadowColor =
        "#ffcc00";


        ctx.shadowBlur =
        20;


        ctx.fillStyle =
        "#ffcc00";



        ctx.beginPath();


        ctx.arc(
            orb.x,
            orb.y,
            8,
            0,
            Math.PI*2
        );


        ctx.fill();



        ctx.restore();


    }


}





// ======================================================
// SCRAP DROPS
// ======================================================


function drawScrap(){


    if(!gameState.scrap)
    return;



    for(
        const item of gameState.scrap
    ){


        if(
            !visibleEntity(
                item.x,
                item.y
            )
        )
        continue;



        ctx.save();


        ctx.shadowColor =
        "#00ffff";


        ctx.shadowBlur =
        12;



        ctx.fillStyle =
        "#00ffff";


        ctx.beginPath();


        ctx.moveTo(
            item.x,
            item.y-7
        );


        ctx.lineTo(
            item.x+7,
            item.y
        );


        ctx.lineTo(
            item.x,
            item.y+7
        );


        ctx.lineTo(
            item.x-7,
            item.y
        );


        ctx.closePath();


        ctx.fill();


        ctx.restore();


    }


}





// ======================================================
// STRUCTURES
// ======================================================


function structureColor(type){


    if(
        type.includes("Wall")
        ||
        type==="Gate"
        ||
        type==="Vault"
    )
    return "#64748b";



    if(
        type.includes("Trap")
        ||
        type==="Mine"
        ||
        type==="Tesla Coil"
    )
    return "#ef4444";



    return "#3b82f6";


}





function drawStructures(){


    if(!gameState.structures)
    return;



    for(
        const s of gameState.structures
    ){


        if(
            !visibleEntity(
                s.x,
                s.y
            )
        )
        continue;



        ctx.save();



        ctx.fillStyle =
        structureColor(
            s.type
        );


        ctx.strokeStyle =
        "#ffffff";



        ctx.lineWidth =
        2;



        ctx.shadowColor =
        structureColor(
            s.type
        );


        ctx.shadowBlur =
        10;



        ctx.fillRect(
            s.x-22,
            s.y-22,
            44,
            44
        );



        ctx.strokeRect(
            s.x-22,
            s.y-22,
            44,
            44
        );



        ctx.shadowBlur=0;



        ctx.fillStyle =
        "#fff";


        ctx.font =
        "10px Arial";


        ctx.textAlign =
        "center";



        ctx.fillText(
            s.type.split(" ")[0],
            s.x,
            s.y+4
        );



        drawHealthBar(
            s.x,
            s.y-35,
            50,
            s.hp,
            s.max_hp,
            "#22c55e"
        );



        ctx.restore();


    }


}






// ======================================================
// PROJECTILES
// ======================================================


function drawProjectiles(){


    if(!gameState.projectiles)
    return;



    for(
        const p of gameState.projectiles
    ){


        if(
            !visibleEntity(
                p.x,
                p.y
            )
        )
        continue;



        ctx.save();


        ctx.shadowColor =
        "#ff3366";


        ctx.shadowBlur =
        15;


        ctx.fillStyle =
        "#ff3366";


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            6,
            0,
            Math.PI*2
        );


        ctx.fill();



        ctx.restore();


    }


}





// ======================================================
// PLAYERS
// ======================================================


function playerColor(level){


    if(level>=15)
    return "#ff00ff";


    if(level>=10)
    return "#ff9900";


    if(level>=5)
    return "#00ffff";


    return "#00ffcc";


}





function drawPlayers(){


    if(!gameState.players)
    return;



    for(
        const id in gameState.players
    ){


        const p =
        gameState.players[id];



        if(
            !visibleEntity(
                p.x,
                p.y
            )
        )
        continue;



        const mine =
        id===playerId;



        ctx.save();



        ctx.shadowColor =
        playerColor(
            p.level
        );


        ctx.shadowBlur =
        18;



        ctx.fillStyle =
        mine
        ?
        "#ffffff"
        :
        playerColor(
            p.level
        );



        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            22,
            0,
            Math.PI*2
        );


        ctx.fill();



        ctx.shadowBlur=0;



        ctx.strokeStyle =
        "#ffffff";


        ctx.lineWidth=3;


        ctx.stroke();



        ctx.restore();




        ctx.fillStyle =
        "#fff";


        ctx.font =
        "bold 12px Arial";


        ctx.textAlign =
        "center";



        ctx.fillText(

            "LVL "+p.level,

            p.x,

            p.y-35

        );



        drawHealthBar(

            p.x,

            p.y-28,

            55,

            p.hp,

            p.max_hp,

            "#00ff66"

        );


    }


}





// ======================================================
// UPDATE MAIN RENDER PIPELINE
// ======================================================


const oldGameLoop = gameLoop;


gameLoop = function(){


    updateCamera();



    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    worldStart();



    drawWorld();


    // New render layers

    drawOrbs();

    drawScrap();

    drawStructures();

    drawProjectiles();

    drawPlayers();



    worldEnd();



    requestAnimationFrame(
        gameLoop
    );


};

// ======================================================
// BUILDING SYSTEM
// ======================================================


const BUILDINGS = [

"Wood Wall",
"Stone Wall",
"Iron Wall",
"Gate",
"Vault",
"Barbed Wire",

"Spike Trap",
"Flame Trap",
"Ice Trap",
"Mine",
"Tesla Coil",

"Healing Totem",
"Speed Pad",
"Shield Gen",
"Radar Tower",
"Bounce Pad",
"Ammo Station",
"Teleporter",
"Mortar",
"Mini Turret"

];



let selectedBuild =
"Wood Wall";


let buildMode=false;


let mouseWorld={

x:0,

y:0

};





// ======================================================
// MOUSE WORLD POSITION
// ======================================================


function updateMouseWorld(){


mouseWorld.x =
camera.x +
(
mouse.x -
canvas.width/2
);


mouseWorld.y =
camera.y +
(
mouse.y -
canvas.height/2
);


}




window.addEventListener(
"mousemove",
()=>{

updateMouseWorld();

});






// ======================================================
// BUILD PREVIEW
// ======================================================


function drawBuildPreview(){


if(!buildMode)
return;



let x =
Math.round(
mouseWorld.x /
TILE_SIZE
)
*
TILE_SIZE;



let y =
Math.round(
mouseWorld.y /
TILE_SIZE
)
*
TILE_SIZE;



ctx.save();



ctx.globalAlpha=.45;



ctx.fillStyle=
"#00ffcc";



ctx.fillRect(

x-25,

y-25,

50,

50

);



ctx.strokeStyle=
"#ffffff";


ctx.strokeRect(

x-25,

y-25,

50,

50

);



ctx.globalAlpha=1;



ctx.fillStyle="#fff";


ctx.font=
"12px Arial";


ctx.textAlign=
"center";



ctx.fillText(

selectedBuild,

x,

y+5

);



ctx.restore();


}






// ======================================================
// BUILD REQUEST
// ======================================================


function placeStructure(){


if(!playerId)
return;



let x =
Math.round(
mouseWorld.x /
TILE_SIZE
)
*
TILE_SIZE;


let y =
Math.round(
mouseWorld.y /
TILE_SIZE
)
*
TILE_SIZE;



fetch(
"/build",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

playerId,

type:selectedBuild,

x,

y

})

}

);



screenShake=8;



spawnParticles(
x,
y,
"#00ffcc",
15
);


}







// ======================================================
// HOTKEY BUILD SELECT
// ======================================================


window.addEventListener(
"keydown",
e=>{


let num =
parseInt(e.key);



if(
num>=1 &&
num<=9
){

selectedBuild =
BUILDINGS[num-1];

}



if(
e.key==="b"
||
e.key==="B"
){

buildMode =
!buildMode;

}



});







// ======================================================
// MOUSE COMBAT
// ======================================================



window.addEventListener(
"mousedown",
e=>{


if(
e.button===0
&&
!buildMode
){


let angle =
Math.atan2(

mouse.y -
canvas.height/2,

mouse.x -
canvas.width/2

);



fetch(
"/shoot",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

playerId,

angle

})

}

);



}



if(
e.button===2
){

placeStructure();


}



});





window.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

});






// ======================================================
// PARTICLE ENGINE
// ======================================================


let particles=[];



function spawnParticles(

x,
y,
color,
amount=20

){


for(
let i=0;
i<amount;
i++
){


particles.push({

x,

y,

vx:
(Math.random()-.5)*8,

vy:
(Math.random()-.5)*8,

life:30+

Math.random()*20,

color


});


}



}





function updateParticles(){


for(
let i=particles.length-1;
i>=0;
i--
){


let p =
particles[i];



p.x+=p.vx;

p.y+=p.vy;


p.vx*=.94;

p.vy*=.94;


p.life--;



if(
p.life<=0
){

particles.splice(
i,
1
);

}



}


}







function drawParticles(){


for(
const p of particles
){


ctx.save();



ctx.globalAlpha =
p.life/50;



ctx.fillStyle =
p.color;



ctx.beginPath();



ctx.arc(

p.x,

p.y,

3,

0,

Math.PI*2

);



ctx.fill();



ctx.restore();



}


}








// ======================================================
// DAMAGE NUMBERS
// ======================================================


let damageTexts=[];



function addDamageText(

x,
y,
amount

){


damageTexts.push({

x,

y,

amount,

life:50

});


}






function updateDamageTexts(){


for(
let i=damageTexts.length-1;
i>=0;
i--
){


let d =
damageTexts[i];


d.y-=1;


d.life--;



if(
d.life<=0
){

damageTexts.splice(
i,
1
);

}


}



}




function drawDamageTexts(){


ctx.font=
"bold 16px Arial";


ctx.textAlign=
"center";



for(
const d of damageTexts
){


ctx.fillStyle=
"#ff4444";


ctx.fillText(

"-"+d.amount,

d.x,

d.y

);



}


}







// ======================================================
// SCREEN SHAKE
// ======================================================


let screenShake=0;



function applyShake(){


if(
screenShake<=0
)
return;



ctx.translate(

(Math.random()-.5)
*
screenShake,

(Math.random()-.5)
*
screenShake

);



screenShake*=.85;



if(
screenShake<.2
)
screenShake=0;


}







// ======================================================
// FINAL RENDER OVERRIDE
// ======================================================


const previousLoop =
gameLoop;



gameLoop=function(){



updateCamera();



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);



ctx.save();



applyShake();



worldStart();



drawWorld();


drawOrbs();

drawScrap();

drawStructures();

drawProjectiles();

drawPlayers();


drawBuildPreview();


drawParticles();


drawDamageTexts();



worldEnd();



ctx.restore();



updateParticles();

updateDamageTexts();



requestAnimationFrame(
gameLoop
);



};

// ======================================================
// MOBILE TOUCH CONTROLS
// ======================================================


const mobile = {

enabled:
'ontouchstart' in window
||
navigator.maxTouchPoints>0,


moveX:0,

moveY:0

};




let joystick={

active:false,

x:0,

y:0

};





if(mobile.enabled){


const joy =
document.createElement("div");


joy.style.position="absolute";

joy.style.left="40px";

joy.style.bottom="40px";

joy.style.width="130px";

joy.style.height="130px";

joy.style.borderRadius="50%";

joy.style.background=
"rgba(0,255,204,.15)";

joy.style.border=
"2px solid #00ffcc";


joy.id="joystick";

document.body.appendChild(joy);




const knob =
document.createElement("div");


knob.style.width="50px";

knob.style.height="50px";

knob.style.borderRadius="50%";

knob.style.background="#00ffcc";

knob.style.position="absolute";

knob.style.left="40px";

knob.style.top="40px";


joy.appendChild(knob);





joy.addEventListener(
"touchstart",
e=>{


joystick.active=true;


});


window.addEventListener(
"touchmove",
e=>{


if(!joystick.active)
return;



let t =
e.touches[0];


let r =
joy.getBoundingClientRect();



let dx =
t.clientX -
(r.left+r.width/2);



let dy =
t.clientY -
(r.top+r.height/2);



let dist =
Math.sqrt(
dx*dx+dy*dy
);



let max=40;



if(dist>max){

dx =
dx/dist*max;

dy =
dy/dist*max;

}



knob.style.transform =
`
translate(
${dx}px,
${dy}px
)
`;



mobile.moveX =
dx/max;


mobile.moveY =
dy/max;


});




window.addEventListener(
"touchend",
()=>{


joystick.active=false;


mobile.moveX=0;

mobile.moveY=0;


knob.style.transform=
"translate(0,0)";


});






// FIRE BUTTON


const fire =
document.createElement("button");

// ======================================================
// SHOOT FUNCTION
// ======================================================


function shoot(){


if(!playerId)
return;



let angle =
Math.atan2(

mouse.y-canvas.height/2,

mouse.x-canvas.width/2

);



fetch(
"/shoot",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

playerId,

angle

})

}

);


}







// ======================================================
// MOBILE MOVEMENT SUPPORT
// ======================================================


const oldMovement =
movementTick;



movementTick=function(){


if(!playerId)
return;



let vx=0;

let vy=0;



if(keys["w"]||
keys["arrowup"])

vy=-1;


if(keys["s"]||
keys["arrowdown"])

vy=1;


if(keys["a"]||
keys["arrowleft"])

vx=-1;


if(keys["d"]||
keys["arrowright"])

vx=1;



if(mobile.enabled){

vx += mobile.moveX;

vy += mobile.moveY;

}




localPlayer.x += vx*5;

localPlayer.y += vy*5;



localPlayer.x =
Math.max(
0,
Math.min(
WORLD_SIZE,
localPlayer.x
)
);



localPlayer.y =
Math.max(
0,
Math.min(
WORLD_SIZE,
localPlayer.y
)
);




fetch(
"/update",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:

JSON.stringify({

id:playerId,

vx,

vy

})

}

);



};

// ======================================================
// MINIMAP
// ======================================================


const mini =
document.createElement("canvas");


mini.width=180;

mini.height=180;


mini.style.position="absolute";


mini.style.right="20px";


mini.style.bottom="20px";


mini.style.border=
"2px solid #00ffcc";


mini.style.background=
"rgba(0,0,0,.5)";


document.body.appendChild(
mini
);



const miniCtx =
mini.getContext("2d");




function drawMinimap(){


miniCtx.clearRect(
0,
0,
180,
180
);



miniCtx.fillStyle="#080811";


miniCtx.fillRect(
0,
0,
180,
180
);



if(!gameState.players)
return;



for(
const id in gameState.players
){


let p =
gameState.players[id];



miniCtx.fillStyle =
id===playerId
?
"#00ffcc"
:
"#ff3366";



miniCtx.beginPath();


miniCtx.arc(

p.x/WORLD_SIZE*180,

p.y/WORLD_SIZE*180,

4,

0,

Math.PI*2

);



miniCtx.fill();


}



}



setInterval(
drawMinimap,
100
);
