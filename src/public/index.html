
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Multiplayer Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add Lighting
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        scene.add(new THREE.AmbientLight(0x404040));

        // Create Local Player (Green Cube)
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const player = new THREE.Mesh(geometry, material);
        scene.add(player);

        camera.position.z = 5;

        // Generate a random ID for this player
        const playerId = Math.random().toString(36.substring(2, 9));
        const otherPlayers = {};

        // Connect to Python WebSocket Server
        const ws = new WebSocket('ws://localhost:8765');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // If it's a new player, create their mesh (Red Cube)
            if (!otherPlayers[data.id]) {
                const oGeometry = new THREE.BoxGeometry();
                const oMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const oMesh = new THREE.Mesh(oGeometry, oMaterial);
                scene.add(oMesh);
                otherPlayers[data.id] = oMesh;
            }

            // Update other player's position
            otherPlayers[data.id].position.set(data.x, data.y, data.z);
        };

        // Handle Keyboard Inputs
        const speed = 0.1;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function animate() {
            requestAnimationFrame(animate);

            let moved = false;
            if (keys['w']) { player.position.y += speed; moved = true; }
            if (keys['s']) { player.position.y -= speed; moved = true; }
            if (keys['a']) { player.position.x -= speed; moved = true; }
            if (keys['d']) { player.position.x += speed; moved = true; }

            // Send position to server if moved
            if (moved && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    id: playerId,
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z
                }));
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
