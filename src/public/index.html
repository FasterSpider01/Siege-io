<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siege Attack - Massive Multiplayer Arena Game</title>
    <meta name="description" content="Play Siege Attack live! Join a massive 2500x2500 world, build 20 unique structures, level up to 20, and battle players worldwide.">
    <meta name="keywords" content="Siege Attack, multiplayer game, browser game, io game, building game">
    <meta property="og:title" content="Siege Attack">
    <meta property="og:description" content="Real-time multiplayer arena game with 20 building structures and cross-platform play.">
    <meta property="og:type" content="website">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        #buildMenu { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; max-height: 150px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .build-btn { background: #333; color: white; border: 1px solid #555; padding: 5px; cursor: pointer; font-size: 11px; border-radius: 4px; }
        .build-btn:hover { background: #555; }
        #controls { position: absolute; bottom: 20px; right: 20px; display: none; }
        .mobile-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin-left: 10px; user-select: none; }
        #joystick { position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: none; }
        #joystickKnob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 50%; }
        #topBar { position: absolute; top: 10px; right: 10px; }
        button.action { background: #222; color: #fff; border: 1px solid #777; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="topBar">
        <button class="action" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
    <div id="ui">
        <h2 id="hudStats">Level: 1 | HP: 100/100 | XP: 0</h2>
    </div>
    <div id="buildMenu"></div>
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="controls">
        <div class="mobile-btn" id="fireBtn">FIRE</div>
        <div class="mobile-btn" id="buildActionBtn">BUILD</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const structuresList = [
            "Wood Wall", "Stone Wall", "Iron Wall", "Gate", "Vault", "Barbed Wire",
            "Spike Trap", "Flame Trap", "Ice Trap", "Mine", "Tesla Coil",
            "Healing Totem", "Speed Pad", "Shield Gen", "Radar Tower", "Bounce Pad", 
            "Ammo Station", "Teleporter", "Mortar", "Mini Turret"
        ];

        const buildMenu = document.getElementById("buildMenu");
        let selectedStructure = structuresList[0];

        structuresList.forEach(struct => {
            const btn = document.createElement("button");
            btn.className = "build-btn";
            btn.innerText = struct;
            btn.onclick = () => { selectedStructure = struct; };
            buildMenu.appendChild(btn);
        });

        let playerId = null;
        let gameState = { players: {}, orbs: [], structures: [] };
        let myPos = { x: 1250, y: 1250 };
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', e => {
            if (!playerId) return;
            const worldX = myPos.x + (e.clientX - canvas.width / 2);
            const worldY = myPos.y + (e.clientY - canvas.height / 2);
            fetch('/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ structure: { type: selectedStructure, x: worldX, y: worldY, owner: playerId } })
            });
        });

        // Detect mobile
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('controls').style.display = 'block';
            document.getElementById('joystick').style.display = 'block';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Join game
        fetch('/join', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                playerId = data.playerId;
            });

        // Game Loop & Sync
        setInterval(() => {
            if (!playerId) return;

            let speed = 5;
            if (keys['w'] || keys['arrowup']) myPos.y -= speed;
            if (keys['s'] || keys['arrowdown']) myPos.y += speed;
            if (keys['a'] || keys['arrowleft']) myPos.x -= speed;
            if (keys['d'] || keys['arrowright']) myPos.x += speed;

            myPos.x = Math.max(0, Math.min(2500, myPos.x));
            myPos.y = Math.max(0, Math.min(2500, myPos.y));

            fetch('/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: playerId, x: myPos.x, y: myPos.y })
            }).then(res => res.json()).then(() => {});

            fetch('/state')
                .then(res => res.json())
                .then(data => {
                    gameState = data;
                    if (gameState.players[playerId]) {
                        let p = gameState.players[playerId];
                        document.getElementById('hudStats').innerText = `Level: ${p.level} | HP: ${p.hp}/${p.maxHp} | XP: ${p.xp}`;
                    }
                });
        }, 1000 / 30);

        // Render Loop
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (playerId && gameState.players[playerId]) {
                myPos.x = gameState.players[playerId].x;
                myPos.y = gameState.players[playerId].y;
            }

            ctx.save();
            ctx.translate(canvas.width / 2 - myPos.x, canvas.height / 2 - myPos.y);

            // Draw World Boundary (2500x2500)
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 2500, 2500);

            // Draw Orbs
            ctx.fillStyle = "#00ffcc";
            gameState.orbs.forEach(orb => {
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Structures
            ctx.fillStyle = "#888";
            gameState.structures.forEach(s => {
                ctx.fillRect(s.x - 15, s.y - 15, 30, 30);
            });

            // Draw Players
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.fillStyle = id === playerId ? "#ff5555" : "#5555ff";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "12px sans-serif";
                ctx.fillText(`Lvl ${p.level}`, p.x - 15, p.y - 25);
            }

            ctx.restore();
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
